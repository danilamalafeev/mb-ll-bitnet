[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looped-bitnet"
version = "0.1.0"
description = "A small recurrent pointer-chasing experiment with ternary QAT"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
looped-bitnet = "looped_bitnet.__main__:main"

[tool.setuptools.packages.find]
include = ["looped_bitnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
